<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>捞一条</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="description" content="把收藏里没看的，按你的节奏一条条捞出来。">
  <meta name="theme-color" content="#F4F0E8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="捞一条">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar" hidden>
      <a class="tab" data-tab="home" href="#/">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v3M15 3v3"/></svg>
        <span>今天</span>
      </a>
      <a class="tab tab-add" data-tab="save" href="#/save">
        <span class="tab-plus"><svg viewBox="0 0 24 24"><path d="M12 7v10M7 12h10"/></svg></span>
        <span>存一条</span>
      </a>
      <a class="tab" data-tab="queue" href="#/queue">
        <svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
        <span>队伍</span>
      </a>
      <a class="tab" data-tab="settings" href="#/settings">
        <svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></svg>
        <span>作息</span>
      </a>
    </nav>
    <div id="toast" class="toast" hidden></div>
    <div id="sheet-root"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
